rules:
  # =====================
  # JavaScript / TypeScript (Node / browser)
  # =====================
  - id: cryptoscope.node.createcipher.deprecated
    languages: [javascript, typescript]
    message: crypto.createCipher/Decipher is deprecated and insecure.
    severity: ERROR
    metadata:
      category: cipher
      recommendation: Use crypto.createCipheriv/CreateDecipheriv with AEAD (e.g., aes-256-gcm).
    patterns:
      - pattern-either:
          - pattern: crypto.createCipher(...)
          - pattern: crypto.createDecipher(...)

  - id: cryptoscope.node.aes.ecb
    languages: [javascript, typescript]
    message: AES-ECB detected (deterministic, leaks patterns).
    severity: ERROR
    metadata:
      category: mode
      recommendation: Use an AEAD mode like AES-GCM/ChaCha20-Poly1305.
    patterns:
      - pattern-either:
          - pattern: crypto.createCipheriv($ALGO, ...)
          - pattern: createCipheriv($ALGO, ...)
          - pattern: crypto.createDecipheriv($ALGO, ...)
          - pattern: createDecipheriv($ALGO, ...)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"'][^\"']*ecb[^\"']*[\"']$"

  - id: cryptoscope.node.aes.cbc
    languages: [javascript, typescript]
    message: AES-CBC detected. Correct IV handling and authentication needed.
    severity: WARNING
    metadata:
      category: mode
      recommendation: Prefer AEAD (AES-GCM/ChaCha20-Poly1305) when available.
    patterns:
      - pattern-either:
          - pattern: crypto.createCipheriv($ALGO, ...)
          - pattern: createCipheriv($ALGO, ...)
          - pattern: crypto.createDecipheriv($ALGO, ...)
          - pattern: createDecipheriv($ALGO, ...)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"'][^\"']*cbc[^\"']*[\"']$"

  - id: cryptoscope.node.aes.cbc.zeroiv.bufferalloc
    languages: [javascript, typescript]
    message: AES-CBC with a zero IV detected (Buffer.alloc(...)).
    severity: ERROR
    metadata:
      category: mode
      recommendation: Use a random IV and an AEAD mode like AES-GCM.
    patterns:
      - pattern-either:
          - pattern: crypto.createCipheriv($ALGO, $KEY, Buffer.alloc($N))
          - pattern: createCipheriv($ALGO, $KEY, Buffer.alloc($N))
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"'][^\"']*cbc[^\"']*[\"']$"

  - id: cryptoscope.node.aes.cbc.zeroiv.bufferalloc_explicit_zero
    languages: [javascript, typescript]
    message: AES-CBC with a zero IV detected (Buffer.alloc(..., 0)).
    severity: ERROR
    metadata:
      category: mode
      recommendation: Use a random IV and an AEAD mode like AES-GCM.
    patterns:
      - pattern-either:
          - pattern: crypto.createCipheriv($ALGO, $KEY, Buffer.alloc($N, 0))
          - pattern: createCipheriv($ALGO, $KEY, Buffer.alloc($N, 0))
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"'][^\"']*cbc[^\"']*[\"']$"

  - id: cryptoscope.node.aes.cbc.zeroiv.uint8array
    languages: [javascript, typescript]
    message: AES-CBC with a zero IV detected (new Uint8Array(...)).
    severity: ERROR
    metadata:
      category: mode
      recommendation: Use a random IV and an AEAD mode like AES-GCM.
    patterns:
      - pattern-either:
          - pattern: crypto.createCipheriv($ALGO, $KEY, new Uint8Array($N))
          - pattern: createCipheriv($ALGO, $KEY, new Uint8Array($N))
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"'][^\"']*cbc[^\"']*[\"']$"

  - id: cryptoscope.node.aes.gcm
    languages: [javascript, typescript]
    message: AES-GCM usage detected (AEAD).
    severity: INFO
    metadata:
      category: mode
    patterns:
      - pattern-either:
          - pattern: crypto.createCipheriv($ALGO, ...)
          - pattern: createCipheriv($ALGO, ...)
          - pattern: crypto.createDecipheriv($ALGO, ...)
          - pattern: createDecipheriv($ALGO, ...)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"'][^\"']*gcm[^\"']*[\"']$"

  - id: cryptoscope.js.math.random
    languages: [javascript, typescript]
    message: Math.random used. Not cryptographically secure.
    severity: ERROR
    metadata:
      category: random
      recommendation: Use crypto.getRandomValues or crypto.randomBytes.
    pattern: Math.random(...)

  - id: cryptoscope.node.randombytes
    languages: [javascript, typescript]
    message: crypto.randomBytes usage detected (CSPRNG).
    severity: INFO
    metadata:
      category: random
    pattern: crypto.randomBytes(...)

  - id: cryptoscope.node.hmac.sha1
    languages: [javascript, typescript]
    message: HMAC with SHA-1 detected.
    severity: ERROR
    metadata:
      category: mac
      recommendation: Use HMAC with SHA-256 or better.
    patterns:
      - pattern-either:
          - pattern: $C.createHmac($ALGO, ...)
          - pattern: createHmac($ALGO, ...)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']sha-?1[\"']$"

  - id: cryptoscope.node.hmac.generic
    languages: [javascript, typescript]
    message: HMAC usage detected.
    severity: INFO
    metadata:
      category: mac
    pattern: $C.createHmac(...)

  - id: cryptoscope.node.hash.md5
    languages: [javascript, typescript]
    message: MD5 detected (collision-prone, not suitable for security).
    severity: ERROR
    metadata:
      category: hash
      recommendation: Use SHA-256/384+ or BLAKE2/3 depending on needs.
    patterns:
      - pattern-either:
          - pattern: $C.createHash($ALGO, ...)
          - pattern: createHash($ALGO, ...)
          - pattern: CryptoJS.MD5(...)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']md5[\"']$"

  - id: cryptoscope.node.hash.sha1
    languages: [javascript, typescript]
    message: SHA-1 detected (collision-prone, avoid for new designs).
    severity: ERROR
    metadata:
      category: hash
      recommendation: Prefer SHA-256/384+, BLAKE2/3, or SHA-3.
    patterns:
      - pattern-either:
          - pattern: $C.createHash($ALGO, ...)
          - pattern: createHash($ALGO, ...)
          - pattern: CryptoJS.SHA1(...)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']sha-?1[\"']$"

  - id: cryptoscope.node.kdf.pbkdf2.iterations.low
    languages: [javascript, typescript]
    message: PBKDF2 iterations too low (< 10000).
    severity: ERROR
    metadata:
      category: kdf
      recommendation: Use >= 100k iterations with SHA-256 or stronger (consider 200k-600k+).
    patterns:
      - pattern-either:
          - pattern: $C.pbkdf2($P, $S, $N, ...)
          - pattern: $C.pbkdf2Sync($P, $S, $N, ...)
          - pattern: pbkdf2($P, $S, $N, ...)
          - pattern: pbkdf2Sync($P, $S, $N, ...)
      - metavariable-comparison:
          metavariable: N
          comparison: N < 10000

  - id: cryptoscope.node.kdf.pbkdf2.iterations.maybe_low
    languages: [javascript, typescript]
    message: PBKDF2 iterations may be low (< 100000).
    severity: WARNING
    metadata:
      category: kdf
      recommendation: Consider >= 100k iterations with SHA-256 or stronger.
    patterns:
      - pattern-either:
          - pattern: $C.pbkdf2($P, $S, $N, ...)
          - pattern: $C.pbkdf2Sync($P, $S, $N, ...)
          - pattern: pbkdf2($P, $S, $N, ...)
          - pattern: pbkdf2Sync($P, $S, $N, ...)
      - metavariable-comparison:
          metavariable: N
          comparison: N < 100000

  - id: cryptoscope.node.kdf.pbkdf2
    languages: [javascript, typescript]
    message: PBKDF2 usage detected.
    severity: INFO
    metadata:
      category: kdf
      recommendation: Ensure sufficient iterations and a modern hash (SHA-256).
    pattern-either:
      - pattern: $C.pbkdf2(...)
      - pattern: $C.pbkdf2Sync(...)
      - pattern: pbkdf2(...)
      - pattern: pbkdf2Sync(...)

  # =====================
  # Java
  # =====================
  - id: cryptoscope.java.hash.md5
    languages: [java]
    message: MD5 detected (collision-prone, not suitable for security).
    severity: ERROR
    metadata:
      category: hash
      recommendation: Use SHA-256/384/512 or SHA-3/BLAKE2/3.
    patterns:
      - pattern-either:
          - pattern: MessageDigest.getInstance($ALGO)
          - pattern: MessageDigest.getInstance($ALGO, ...)
          - pattern: java.security.MessageDigest.getInstance($ALGO)
          - pattern: java.security.MessageDigest.getInstance($ALGO, ...)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']MD5[\"']$"

  - id: cryptoscope.java.hash.sha1
    languages: [java]
    message: SHA-1 detected (collision-prone, avoid for new designs).
    severity: ERROR
    metadata:
      category: hash
      recommendation: Prefer SHA-256/384+, BLAKE2/3, or SHA-3.
    patterns:
      - pattern-either:
          - pattern: MessageDigest.getInstance($ALGO)
          - pattern: MessageDigest.getInstance($ALGO, ...)
          - pattern: java.security.MessageDigest.getInstance($ALGO)
          - pattern: java.security.MessageDigest.getInstance($ALGO, ...)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?sha-?1[\"']?$"

  - id: cryptoscope.java.hash.sha2
    languages: [java]
    message: SHA-2 family usage detected (SHA-224/256/384/512).
    severity: INFO
    metadata:
      category: hash
      recommendation: Ensure a secure construction (e.g., HMAC, HKDF) where appropriate.
    patterns:
      - pattern-either:
          - pattern: MessageDigest.getInstance($ALGO)
          - pattern: java.security.MessageDigest.getInstance($ALGO)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?SHA-?(?:224|256|384|512)[\"']?$"

  - id: cryptoscope.java.mac.sha1
    languages: [java]
    message: HMAC with SHA-1 detected.
    severity: ERROR
    metadata:
      category: mac
      recommendation: Use HmacSHA256 or stronger.
    patterns:
      - pattern-either:
          - pattern: Mac.getInstance($ALGO)
          - pattern: Mac.getInstance($ALGO, ...)
          - pattern: javax.crypto.Mac.getInstance($ALGO)
          - pattern: javax.crypto.Mac.getInstance($ALGO, ...)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?hmacsha-?1[\"']?$"

  - id: cryptoscope.java.signature.md5
    languages: [java]
    message: Signature with MD5 digest detected (vulnerable to collisions).
    severity: ERROR
    metadata:
      category: signature
      recommendation: Use SHA-256/384+ or EdDSA for digital signatures.
    patterns:
      - pattern-either:
          - pattern: Signature.getInstance($ALGO)
          - pattern: java.security.Signature.getInstance($ALGO)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?MD5with(?:RSA|DSA|ECDSA)[\"']?$"

  - id: cryptoscope.java.signature.sha1
    languages: [java]
    message: Signature with SHA-1 digest detected (collision-prone).
    severity: WARNING
    metadata:
      category: signature
      recommendation: Prefer SHA-256/384+, SHA-3, or modern signature schemes like Ed25519.
    patterns:
      - pattern-either:
          - pattern: Signature.getInstance($ALGO)
          - pattern: java.security.Signature.getInstance($ALGO)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?SHA-?1with(?:RSA|DSA|ECDSA|RSAandMGF1)[\"']?$"

  - id: cryptoscope.java.signature.none
    languages: [java]
    message: Signature without hashing detected (NONEwith*).
    severity: ERROR
    metadata:
      category: signature
      recommendation: Hash the message before signing (e.g., SHA-256 with RSA/ECDSA).
    patterns:
      - pattern-either:
          - pattern: Signature.getInstance($ALGO)
          - pattern: java.security.Signature.getInstance($ALGO)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?NONEwith(?:RSA|ECDSA|DSA)[\"']?$"

  - id: cryptoscope.java.signature.modern
    languages: [java]
    message: Modern signature algorithm detected (Ed25519/Ed448).
    severity: INFO
    metadata:
      category: signature
    patterns:
      - pattern-either:
          - pattern: Signature.getInstance($ALGO)
          - pattern: java.security.Signature.getInstance($ALGO)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?Ed(?:25519|448)[\"']?$"

  - id: cryptoscope.java.aes.ecb
    languages: [java]
    message: AES/ECB mode detected (insecure).
    severity: ERROR
    metadata:
      category: mode
      recommendation: "Use GCM: Cipher.getInstance(\"AES/GCM/NoPadding\")."
    patterns:
      - pattern-either:
          - pattern: Cipher.getInstance($ALGO)
          - pattern: javax.crypto.Cipher.getInstance($ALGO)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?AES/ECB/[^\"']+[\"']?$"

  - id: cryptoscope.java.aes.cbc
    languages: [java]
    message: AES/CBC detected; ensure authentication (e.g., HMAC) and random IV.
    severity: WARNING
    metadata:
      category: mode
      recommendation: Prefer GCM (AEAD) when possible.
    patterns:
      - pattern-either:
          - pattern: Cipher.getInstance($ALGO)
          - pattern: javax.crypto.Cipher.getInstance($ALGO)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?AES/CBC/[^\"']+[\"']?$"

  - id: cryptoscope.java.cipher.gcm
    languages: [java]
    message: AES/GCM usage detected (AEAD).
    severity: INFO
    metadata:
      category: mode
    patterns:
      - pattern-either:
          - pattern: Cipher.getInstance($ALGO)
          - pattern: Cipher.getInstance($ALGO, ...)
          - pattern: javax.crypto.Cipher.getInstance($ALGO)
          - pattern: javax.crypto.Cipher.getInstance($ALGO, ...)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?AES/GCM/[^\"']+[\"']?$"

  - id: cryptoscope.java.cipher.any
    languages: [java]
    message: Cipher.getInstance usage detected.
    severity: INFO
    metadata:
      category: cipher
    pattern-either:
      - pattern: Cipher.getInstance(...)
      - pattern: javax.crypto.Cipher.getInstance(...)

  - id: cryptoscope.java.rsa.pkcs1padding
    languages: [java]
    message: RSA with PKCS#1 v1.5 padding detected (vulnerable to padding oracles).
    severity: WARNING
    metadata:
      category: cipher
      recommendation: Use OAEP (e.g., "RSA/ECB/OAEPWithSHA-256AndMGF1Padding").
    patterns:
      - pattern-either:
          - pattern: Cipher.getInstance($TRANSFORM)
          - pattern: javax.crypto.Cipher.getInstance($TRANSFORM)
      - metavariable-regex:
          metavariable: TRANSFORM
          regex: "(?i)^[\"']?RSA/ECB/PKCS1Padding[\"']?$"

  - id: cryptoscope.java.rsa.oaep.sha1
    languages: [java]
    message: RSA OAEP with SHA-1 detected (consider SHA-256+).
    severity: WARNING
    metadata:
      category: cipher
      recommendation: Prefer OAEP with SHA-256+, e.g., "RSA/ECB/OAEPWithSHA-256AndMGF1Padding".
    patterns:
      - pattern-either:
          - pattern: Cipher.getInstance($TRANSFORM)
          - pattern: javax.crypto.Cipher.getInstance($TRANSFORM)
      - metavariable-regex:
          metavariable: TRANSFORM
          regex: "(?i)^[\"']?RSA/ECB/OAEPWithSHA-?1AndMGF1Padding[\"']?$"

  - id: cryptoscope.java.aes.unspecified
    languages: [java]
    message: AES without mode/padding specified (provider default; often ECB).
    severity: WARNING
    metadata:
      category: mode
      recommendation: Specify an AEAD mode explicitly, e.g., "AES/GCM/NoPadding".
    pattern-either:
      - pattern: Cipher.getInstance("AES")
      - pattern: javax.crypto.Cipher.getInstance("AES")

  - id: cryptoscope.java.mac.generic
    languages: [java]
    message: Mac primitive usage detected.
    severity: INFO
    metadata:
      category: mac
    pattern-either:
      - pattern: Mac.getInstance(...)
      - pattern: javax.crypto.Mac.getInstance(...)

  - id: cryptoscope.java.kdf.pbkdf2.sha256
    languages: [java]
    message: PBKDF2 with HmacSHA256 usage detected.
    severity: INFO
    metadata:
      category: kdf
    pattern-either:
      - pattern: SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256")
      - pattern: javax.crypto.SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256")

  - id: cryptoscope.java.keygen.aes
    languages: [java]
    message: Symmetric key generation (AES) detected.
    severity: INFO
    metadata:
      category: keygen
    pattern-either:
      - pattern: KeyGenerator.getInstance("AES")
      - pattern: javax.crypto.KeyGenerator.getInstance("AES")

  - id: cryptoscope.java.keypair.rsa
    languages: [java]
    message: RSA keypair generation detected.
    severity: INFO
    metadata:
      category: keygen
    pattern-either:
      - pattern: KeyPairGenerator.getInstance("RSA")
      - pattern: java.security.KeyPairGenerator.getInstance("RSA")

  - id: cryptoscope.java.keypair.rsa.small
    languages: [java]
    message: RSA key size set below 2048 bits.
    severity: ERROR
    metadata:
      category: keygen
      recommendation: Use at least 2048-bit RSA keys (3072+ preferred) or switch to ECC.
    patterns:
      - pattern-either:
          - pattern: KeyPairGenerator.getInstance("RSA").initialize($BITS)
          - pattern: KeyPairGenerator.getInstance("RSA").initialize($BITS, ...)
          - pattern: java.security.KeyPairGenerator.getInstance("RSA").initialize($BITS)
          - pattern: java.security.KeyPairGenerator.getInstance("RSA").initialize($BITS, ...)
          - patterns:
              - pattern: $GEN.initialize($BITS)
              - pattern-inside: |
                  KeyPairGenerator $GEN = KeyPairGenerator.getInstance("RSA");
          - patterns:
              - pattern: $GEN.initialize($BITS, ...)
              - pattern-inside: |
                  KeyPairGenerator $GEN = KeyPairGenerator.getInstance("RSA");
          - patterns:
              - pattern: $GEN.initialize($BITS)
              - pattern-inside: |
                  java.security.KeyPairGenerator $GEN = java.security.KeyPairGenerator.getInstance("RSA");
          - patterns:
              - pattern: $GEN.initialize($BITS, ...)
              - pattern-inside: |
                  java.security.KeyPairGenerator $GEN = java.security.KeyPairGenerator.getInstance("RSA");
      - metavariable-comparison:
          metavariable: BITS
          comparison: BITS < 2048

  - id: cryptoscope.java.keypair.dsa
    languages: [java]
    message: DSA keypair generation detected (legacy algorithm).
    severity: WARNING
    metadata:
      category: keygen
      recommendation: Prefer Ed25519/Ed448 or ECDSA with modern curves.
    pattern-either:
      - pattern: KeyPairGenerator.getInstance("DSA")
      - pattern: java.security.KeyPairGenerator.getInstance("DSA")

  - id: cryptoscope.java.aes.cbc.zeroiv
    languages: [java]
    message: Zero-initialized IV via IvParameterSpec(new byte[n]).
    severity: ERROR
    metadata:
      category: mode
      recommendation: Use a random IV and prefer GCM (AEAD).
    pattern-either:
      - pattern: new IvParameterSpec(new byte[$N])
      - pattern: new javax.crypto.spec.IvParameterSpec(new byte[$N])

  - id: cryptoscope.java.random.insecure
    languages: [java]
    message: Non-cryptographic RNG detected (Random/Math.random/ThreadLocalRandom).
    severity: ERROR
    metadata:
      category: random
      recommendation: Use java.security.SecureRandom.
    pattern-either:
      - pattern: new Random(...)
      - pattern: new java.util.Random(...)
      - pattern: Math.random(...)
      - pattern: java.lang.Math.random(...)
      - pattern: ThreadLocalRandom.current().nextBoolean(...)
      - pattern: ThreadLocalRandom.current().nextBytes(...)
      - pattern: ThreadLocalRandom.current().nextDouble(...)
      - pattern: ThreadLocalRandom.current().nextFloat(...)
      - pattern: ThreadLocalRandom.current().nextGaussian(...)
      - pattern: ThreadLocalRandom.current().nextInt(...)
      - pattern: ThreadLocalRandom.current().nextLong(...)
      - pattern: java.util.concurrent.ThreadLocalRandom.current().nextBoolean(...)
      - pattern: java.util.concurrent.ThreadLocalRandom.current().nextBytes(...)
      - pattern: java.util.concurrent.ThreadLocalRandom.current().nextDouble(...)
      - pattern: java.util.concurrent.ThreadLocalRandom.current().nextFloat(...)
      - pattern: java.util.concurrent.ThreadLocalRandom.current().nextGaussian(...)
      - pattern: java.util.concurrent.ThreadLocalRandom.current().nextInt(...)
      - pattern: java.util.concurrent.ThreadLocalRandom.current().nextLong(...)
      - pattern: new SplittableRandom(...)
      - pattern: new java.util.SplittableRandom(...)

  - id: cryptoscope.java.random.sha1prng
    languages: [java]
    message: SecureRandom with SHA1PRNG detected (legacy provider).
    severity: WARNING
    metadata:
      category: random
      recommendation: Prefer default SecureRandom provider or SecureRandom.getInstanceStrong().
    patterns:
      - pattern-either:
          - pattern: SecureRandom.getInstance($ALGO)
          - pattern: SecureRandom.getInstance($ALGO, ...)
          - pattern: java.security.SecureRandom.getInstance($ALGO)
          - pattern: java.security.SecureRandom.getInstance($ALGO, ...)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?SHA1PRNG[\"']?$"

  - id: cryptoscope.java.random.seed.constant
    languages: [java]
    message: SecureRandom seeded with constant or zeroed byte array.
    severity: ERROR
    metadata:
      category: random
      recommendation: Let SecureRandom self-seed or use os-provided entropy sources.
    patterns:
      - pattern-either:
          - pattern: new SecureRandom($SEED)
          - pattern: new java.security.SecureRandom($SEED)
          - patterns:
              - pattern: $SR.setSeed($SEED)
              - pattern-inside: |
                  SecureRandom $SR = ...;
          - patterns:
              - pattern: $SR.setSeed($SEED)
              - pattern-inside: |
                  java.security.SecureRandom $SR = ...;
      - metavariable-pattern:
          metavariable: SEED
          pattern-either:
            - pattern: new byte[$N]
            - pattern: new byte[] { ... }

  - id: cryptoscope.java.securerandom
    languages: [java]
    message: SecureRandom usage detected (CSPRNG).
    severity: INFO
    metadata:
      category: random
    pattern-either:
      - pattern: new SecureRandom(...)
      - pattern: SecureRandom.getInstance(...)
      - pattern: new java.security.SecureRandom(...)
      - pattern: java.security.SecureRandom.getInstance(...)

  # =====================
  # C / C++ (OpenSSL, libc)
  # =====================
  - id: cryptoscope.c.hash.weak
    languages: [c, cpp]
    message: Weak hash primitive detected (MD2/MD4/MD5/SHA1 family).
    severity: ERROR
    metadata:
      category: hash
      recommendation: Use SHA-256/512, SHA-3, or BLAKE2/3 instead.
    patterns:
      - pattern-either:
          - pattern: $FUNC(...)
          - pattern: $FUNC()
      - metavariable-regex:
          metavariable: FUNC
          regex: "\\b(EVP_md[245]|MD[245](?:_(?:Init|Update|Final))?|MD[245]|CC_MD5|SHA1(?:_(?:Init|Update|Final))?|SHA1|EVP_sha1)\\b"

  - id: cryptoscope.c.hash.strong
    languages: [c, cpp]
    message: Modern hash primitive detected (SHA-2/SHA-3/BLAKE2).
    severity: INFO
    metadata:
      category: hash
    pattern-either:
      - pattern: EVP_sha256(...)
      - pattern: EVP_sha256()
      - pattern: EVP_sha384(...)
      - pattern: EVP_sha384()
      - pattern: EVP_sha512(...)
      - pattern: EVP_sha512()
      - pattern: EVP_sha3_256(...)
      - pattern: EVP_sha3_256()
      - pattern: EVP_sha3_512(...)
      - pattern: EVP_sha3_512()
      - pattern: EVP_blake2b512(...)
      - pattern: EVP_blake2b512()
      - pattern: EVP_blake2s256(...)
      - pattern: EVP_blake2s256()

  - id: cryptoscope.c.cipher.aes.ecb
    languages: [c, cpp]
    message: AES ECB usage detected.
    severity: ERROR
    metadata:
      category: mode
      recommendation: Prefer AEAD modes such as AES-GCM or ChaCha20-Poly1305.
    patterns:
      - pattern-either:
          - pattern: $FUNC(...)
          - pattern: $FUNC()
      - metavariable-regex:
          metavariable: FUNC
          regex: "\\bEVP_aes_[0-9]+_ecb\\b"

  - id: cryptoscope.c.cipher.des
    languages: [c, cpp]
    message: DES/3DES usage detected (deprecated cipher).
    severity: ERROR
    metadata:
      category: cipher
      recommendation: Migrate to AES-GCM or ChaCha20-Poly1305.
    patterns:
      - pattern-either:
          - pattern: $FUNC(...)
          - pattern: $FUNC()
      - metavariable-regex:
          metavariable: FUNC
          regex: "\\b(EVP_des(?:_ede3)?_(?:ecb|cbc)|DES_(?:ecb|cbc)_encrypt|DES_set_key(?:_unchecked)?)\\b"

  - id: cryptoscope.c.cipher.rc4
    languages: [c, cpp]
    message: RC4 stream cipher detected (insecure).
    severity: ERROR
    metadata:
      category: cipher
      recommendation: Replace RC4 with ChaCha20 or AES-GCM.
    patterns:
      - pattern-either:
          - pattern: $FUNC(...)
          - pattern: $FUNC()
      - metavariable-regex:
          metavariable: FUNC
          regex: "\\b(EVP_rc4|RC4_set_key|RC4)\\b"

  - id: cryptoscope.c.cipher.aead
    languages: [c, cpp]
    message: AEAD cipher usage detected (AES-GCM/ChaCha20-Poly1305).
    severity: INFO
    metadata:
      category: mode
    pattern-either:
      - pattern: EVP_aes_128_gcm(...)
      - pattern: EVP_aes_128_gcm()
      - pattern: EVP_aes_256_gcm(...)
      - pattern: EVP_aes_256_gcm()
      - pattern: EVP_aes_128_ccm(...)
      - pattern: EVP_aes_128_ccm()
      - pattern: EVP_chacha20_poly1305(...)
      - pattern: EVP_chacha20_poly1305()

  - id: cryptoscope.c.hmac.weak
    languages: [c, cpp]
    message: HMAC with weak digest detected (MD5/SHA1).
    severity: ERROR
    metadata:
      category: mac
      recommendation: Use HMAC with SHA-256/384/512 or BLAKE2.
    patterns:
      - pattern-either:
          - pattern: HMAC(EVP_md5(), ...)
          - pattern: HMAC(EVP_md5(), ..., ...)
          - pattern: HMAC(EVP_sha1(), ...)
          - pattern: HMAC(EVP_sha1(), ..., ...)
          - pattern: HMAC_Init($CTX, ..., EVP_md5(), ...)
          - pattern: HMAC_Init($CTX, ..., EVP_sha1(), ...)
          - pattern: HMAC_Init_ex($CTX, ..., EVP_md5(), ...)
          - pattern: HMAC_Init_ex($CTX, ..., EVP_sha1(), ...)

  - id: cryptoscope.c.rsa.keygen.small
    languages: [c, cpp]
    message: RSA key size below 2048 bits detected.
    severity: ERROR
    metadata:
      category: keygen
      recommendation: Generate RSA keys with >= 2048 bits or migrate to ECC.
    patterns:
      - pattern-either:
          - pattern: RSA_generate_key_ex($RSA, $BITS, ...)
          - pattern: RSA_generate_key($BITS, ...)
      - metavariable-comparison:
          metavariable: BITS
          comparison: BITS < 2048

  - id: cryptoscope.c.rsa.keygen.ctx.small
    languages: [c, cpp]
    message: RSA keygen context configured with <2048 bits.
    severity: ERROR
    metadata:
      category: keygen
      recommendation: Configure RSA key generation for >= 2048 bits or use ECC.
    patterns:
      - pattern: EVP_PKEY_CTX_set_rsa_keygen_bits($CTX, $BITS)
      - metavariable-comparison:
          metavariable: BITS
          comparison: BITS < 2048

  - id: cryptoscope.c.signature.modern
    languages: [c, cpp]
    message: Modern signature primitive detected (Ed25519/Ed448).
    severity: INFO
    metadata:
      category: signature
    pattern-either:
      - pattern: EVP_PKEY_ED25519
      - pattern: EVP_PKEY_ED448
      - pattern: crypto_sign_ed25519_seed_keypair(...)
      - pattern: crypto_sign_ed25519_keypair(...)

  - id: cryptoscope.c.kdf.pbkdf2.sha1
    languages: [c, cpp]
    message: PBKDF2 with SHA-1 detected (PKCS5_PBKDF2_HMAC_SHA1).
    severity: WARNING
    metadata:
      category: kdf
      recommendation: Use PKCS5_PBKDF2_HMAC with SHA-256/512, scrypt, or Argon2.
    pattern: PKCS5_PBKDF2_HMAC_SHA1(...)

  - id: cryptoscope.c.kdf.pbkdf2.generic
    languages: [c, cpp]
    message: PBKDF2 usage detected.
    severity: INFO
    metadata:
      category: kdf
    pattern-either:
      - pattern: PKCS5_PBKDF2_HMAC(...)

  - id: cryptoscope.c.random.insecure
    languages: [c, cpp]
    message: Non-cryptographic RNG detected (rand/drand48/etc).
    severity: ERROR
    metadata:
      category: random
      recommendation: Use RAND_bytes, getrandom, or arc4random_buf for CSPRNG needs.
    pattern-either:
      - pattern: rand(...)
      - pattern: srand(...)
      - pattern: ::rand(...)
      - pattern: ::srand(...)
      - pattern: random(...)
      - pattern: srandom(...)
      - pattern: drand48(...)
      - pattern: srand48(...)
      - pattern: lrand48(...)
      - pattern: mrand48(...)
      - pattern: std::rand(...)
      - pattern: std::srand(...)

  - id: cryptoscope.c.random.secure
    languages: [c, cpp]
    message: Cryptographically secure randomness detected.
    severity: INFO
    metadata:
      category: random
    pattern-either:
      - pattern: RAND_bytes(...)
      - pattern: RAND_priv_bytes(...)
      - pattern: getrandom(...)
      - pattern: getentropy(...)
      - pattern: arc4random(...)
      - pattern: arc4random_buf(...)
      - pattern: randombytes_buf(...)
      - pattern: randombytes_buf_deterministic(...)
      - pattern: randombytes_uniform(...)

  # =====================
  # Additional Node.js / TypeScript coverage
  # =====================
  - id: cryptoscope.node.hash.generic
    languages: [javascript, typescript]
    message: Hash primitive usage detected.
    severity: INFO
    metadata:
      category: hash
    pattern-either:
      - pattern: $C.createHash($ALGO, ...)
      - pattern: createHash($ALGO, ...)
      - pattern: CryptoJS.$FUNC(...)
    metavariable-regex:
      metavariable: FUNC
      regex: "^(MD5|SHA1|SHA224|SHA256|SHA384|SHA512|SHA3|RIPEMD160)$"

  - id: cryptoscope.node.signature.generic
    languages: [javascript, typescript]
    message: Signature primitive usage detected.
    severity: INFO
    metadata:
      category: signature
    pattern-either:
      - pattern: $C.createSign($ALGO)
      - pattern: createSign($ALGO)
      - pattern: $C.createVerify($ALGO)
      - pattern: createVerify($ALGO)

  - id: cryptoscope.node.signature.weak
    languages: [javascript, typescript]
    message: Weak signature hash algorithm detected (MD5/SHA-1).
    severity: ERROR
    metadata:
      category: signature
      recommendation: Use SHA-256/384+ (e.g., RSA-PSS with SHA-256 or ECDSA with SHA-256).
    patterns:
      - pattern-either:
          - pattern: $C.createSign($ALGO)
          - pattern: createSign($ALGO)
          - pattern: $C.createVerify($ALGO)
          - pattern: createVerify($ALGO)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"'](?:md5|sha-?1)(?:$|[^\"']*)[\"']$"

  - id: cryptoscope.node.rsa.publicencrypt.generic
    languages: [javascript, typescript]
    message: RSA encrypt/decrypt primitive usage detected.
    severity: INFO
    metadata:
      category: cipher
    pattern-either:
      - pattern: crypto.publicEncrypt(...)
      - pattern: publicEncrypt(...)
      - pattern: crypto.privateDecrypt(...)
      - pattern: privateDecrypt(...)

  - id: cryptoscope.node.rsa.oaep.sha1
    languages: [javascript, typescript]
    message: RSA-OAEP with SHA-1 detected (consider SHA-256+).
    severity: WARNING
    metadata:
      category: cipher
      recommendation: Use OAEP with SHA-256+ (oaepHash: 'sha256').
    patterns:
      - pattern-either:
          - pattern: crypto.publicEncrypt({ ..., oaepHash: $ALG, ... }, ...)
          - pattern: publicEncrypt({ ..., oaepHash: $ALG, ... }, ...)
          - pattern: crypto.privateDecrypt({ ..., oaepHash: $ALG, ... }, ...)
          - pattern: privateDecrypt({ ..., oaepHash: $ALG, ... }, ...)
      - metavariable-regex:
          metavariable: ALG
          regex: "(?i)^[\"']sha-?1[\"']$"

  - id: cryptoscope.node.kdf.scrypt.generic
    languages: [javascript, typescript]
    message: scrypt usage detected.
    severity: INFO
    metadata:
      category: kdf
    pattern-either:
      - pattern: crypto.scrypt(...)
      - pattern: scrypt(...)
      - pattern: crypto.scryptSync(...)
      - pattern: scryptSync(...)

  - id: cryptoscope.node.kdf.scrypt.low_cost
    languages: [javascript, typescript]
    message: scrypt cost parameter N appears low (< 16384).
    severity: WARNING
