rules:
  # =====================
  # JavaScript / TypeScript (Node / browser)
  # =====================
  - id: cryptoscope.node.createcipher.deprecated
    languages: [javascript, typescript]
    message: crypto.createCipher/Decipher is deprecated and insecure.
    severity: ERROR
    metadata:
      category: cipher
      recommendation: Use crypto.createCipheriv/CreateDecipheriv with AEAD (e.g., aes-256-gcm).
    patterns:
      - pattern-either:
          - pattern: crypto.createCipher(...)
          - pattern: crypto.createDecipher(...)

  - id: cryptoscope.node.aes.ecb
    languages: [javascript, typescript]
    message: AES-ECB detected (deterministic, leaks patterns).
    severity: ERROR
    metadata:
      category: mode
      recommendation: Use an AEAD mode like AES-GCM/ChaCha20-Poly1305.
    patterns:
      - pattern-either:
          - pattern: crypto.createCipheriv($ALGO, ...)
          - pattern: createCipheriv($ALGO, ...)
          - pattern: crypto.createDecipheriv($ALGO, ...)
          - pattern: createDecipheriv($ALGO, ...)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"'][^\"']*ecb[^\"']*[\"']$"

  - id: cryptoscope.node.aes.cbc
    languages: [javascript, typescript]
    message: AES-CBC detected. Correct IV handling and authentication needed.
    severity: WARNING
    metadata:
      category: mode
      recommendation: Prefer AEAD (AES-GCM/ChaCha20-Poly1305) when available.
    patterns:
      - pattern-either:
          - pattern: crypto.createCipheriv($ALGO, ...)
          - pattern: createCipheriv($ALGO, ...)
          - pattern: crypto.createDecipheriv($ALGO, ...)
          - pattern: createDecipheriv($ALGO, ...)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"'][^\"']*cbc[^\"']*[\"']$"

  - id: cryptoscope.node.aes.cbc.zeroiv.bufferalloc
    languages: [javascript, typescript]
    message: AES-CBC with a zero IV detected (Buffer.alloc(...)).
    severity: ERROR
    metadata:
      category: mode
      recommendation: Use a random IV and an AEAD mode like AES-GCM.
    patterns:
      - pattern-either:
          - pattern: crypto.createCipheriv($ALGO, $KEY, Buffer.alloc($N))
          - pattern: createCipheriv($ALGO, $KEY, Buffer.alloc($N))
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"'][^\"']*cbc[^\"']*[\"']$"

  - id: cryptoscope.node.aes.cbc.zeroiv.bufferalloc_explicit_zero
    languages: [javascript, typescript]
    message: AES-CBC with a zero IV detected (Buffer.alloc(..., 0)).
    severity: ERROR
    metadata:
      category: mode
      recommendation: Use a random IV and an AEAD mode like AES-GCM.
    patterns:
      - pattern-either:
          - pattern: crypto.createCipheriv($ALGO, $KEY, Buffer.alloc($N, 0))
          - pattern: createCipheriv($ALGO, $KEY, Buffer.alloc($N, 0))
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"'][^\"']*cbc[^\"']*[\"']$"

  - id: cryptoscope.node.aes.cbc.zeroiv.uint8array
    languages: [javascript, typescript]
    message: AES-CBC with a zero IV detected (new Uint8Array(...)).
    severity: ERROR
    metadata:
      category: mode
      recommendation: Use a random IV and an AEAD mode like AES-GCM.
    patterns:
      - pattern-either:
          - pattern: crypto.createCipheriv($ALGO, $KEY, new Uint8Array($N))
          - pattern: createCipheriv($ALGO, $KEY, new Uint8Array($N))
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"'][^\"']*cbc[^\"']*[\"']$"

  - id: cryptoscope.node.aes.gcm
    languages: [javascript, typescript]
    message: AES-GCM usage detected (AEAD).
    severity: INFO
    metadata:
      category: mode
    patterns:
      - pattern-either:
          - pattern: crypto.createCipheriv($ALGO, ...)
          - pattern: createCipheriv($ALGO, ...)
          - pattern: crypto.createDecipheriv($ALGO, ...)
          - pattern: createDecipheriv($ALGO, ...)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"'][^\"']*gcm[^\"']*[\"']$"

  - id: cryptoscope.js.math.random
    languages: [javascript, typescript]
    message: Math.random used. Not cryptographically secure.
    severity: ERROR
    metadata:
      category: random
      recommendation: Use crypto.getRandomValues or crypto.randomBytes.
    pattern: Math.random(...)

  - id: cryptoscope.node.randombytes
    languages: [javascript, typescript]
    message: crypto.randomBytes usage detected (CSPRNG).
    severity: INFO
    metadata:
      category: random
    pattern: crypto.randomBytes(...)

  - id: cryptoscope.node.hmac.sha1
    languages: [javascript, typescript]
    message: HMAC with SHA-1 detected.
    severity: ERROR
    metadata:
      category: mac
      recommendation: Use HMAC with SHA-256 or better.
    patterns:
      - pattern-either:
          - pattern: $C.createHmac($ALGO, ...)
          - pattern: createHmac($ALGO, ...)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']sha-?1[\"']$"

  - id: cryptoscope.node.hmac.generic
    languages: [javascript, typescript]
    message: HMAC usage detected.
    severity: INFO
    metadata:
      category: mac
    pattern: $C.createHmac(...)

  - id: cryptoscope.node.hash.md5
    languages: [javascript, typescript]
    message: MD5 detected (collision-prone, not suitable for security).
    severity: ERROR
    metadata:
      category: hash
      recommendation: Use SHA-256/384+ or BLAKE2/3 depending on needs.
    patterns:
      - pattern-either:
          - pattern: $C.createHash($ALGO, ...)
          - pattern: createHash($ALGO, ...)
          - pattern: CryptoJS.MD5(...)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']md5[\"']$"

  - id: cryptoscope.node.hash.sha1
    languages: [javascript, typescript]
    message: SHA-1 detected (collision-prone, avoid for new designs).
    severity: ERROR
    metadata:
      category: hash
      recommendation: Prefer SHA-256/384+, BLAKE2/3, or SHA-3.
    patterns:
      - pattern-either:
          - pattern: $C.createHash($ALGO, ...)
          - pattern: createHash($ALGO, ...)
          - pattern: CryptoJS.SHA1(...)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']sha-?1[\"']$"

  - id: cryptoscope.node.kdf.pbkdf2.iterations.low
    languages: [javascript, typescript]
    message: PBKDF2 iterations too low (< 10000).
    severity: ERROR
    metadata:
      category: kdf
      recommendation: Use >= 100k iterations with SHA-256 or stronger (consider 200k-600k+).
    patterns:
      - pattern-either:
          - pattern: $C.pbkdf2($P, $S, $N, ...)
          - pattern: $C.pbkdf2Sync($P, $S, $N, ...)
          - pattern: pbkdf2($P, $S, $N, ...)
          - pattern: pbkdf2Sync($P, $S, $N, ...)
      - metavariable-comparison:
          metavariable: N
          comparison: N < 10000

  - id: cryptoscope.node.kdf.pbkdf2.iterations.maybe_low
    languages: [javascript, typescript]
    message: PBKDF2 iterations may be low (< 100000).
    severity: WARNING
    metadata:
      category: kdf
      recommendation: Consider >= 100k iterations with SHA-256 or stronger.
    patterns:
      - pattern-either:
          - pattern: $C.pbkdf2($P, $S, $N, ...)
          - pattern: $C.pbkdf2Sync($P, $S, $N, ...)
          - pattern: pbkdf2($P, $S, $N, ...)
          - pattern: pbkdf2Sync($P, $S, $N, ...)
      - metavariable-comparison:
          metavariable: N
          comparison: N < 100000

  - id: cryptoscope.node.kdf.pbkdf2
    languages: [javascript, typescript]
    message: PBKDF2 usage detected.
    severity: INFO
    metadata:
      category: kdf
      recommendation: Ensure sufficient iterations and a modern hash (SHA-256).
    pattern-either:
      - pattern: $C.pbkdf2(...)
      - pattern: $C.pbkdf2Sync(...)
      - pattern: pbkdf2(...)
      - pattern: pbkdf2Sync(...)

  # =====================
  # Java
  # =====================
  - id: cryptoscope.java.hash.md5
    languages: [java]
    message: MD5 detected (collision-prone, not suitable for security).
    severity: ERROR
    metadata:
      category: hash
      recommendation: Use SHA-256/384/512 or SHA-3/BLAKE2/3.
    patterns:
      - pattern-either:
          - pattern: MessageDigest.getInstance($ALGO)
          - pattern: MessageDigest.getInstance($ALGO, ...)
          - pattern: java.security.MessageDigest.getInstance($ALGO)
          - pattern: java.security.MessageDigest.getInstance($ALGO, ...)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']MD5[\"']$"

  - id: cryptoscope.java.hash.sha1
    languages: [java]
    message: SHA-1 detected (collision-prone, avoid for new designs).
    severity: ERROR
    metadata:
      category: hash
      recommendation: Prefer SHA-256/384+, BLAKE2/3, or SHA-3.
    patterns:
      - pattern-either:
          - pattern: MessageDigest.getInstance($ALGO)
          - pattern: MessageDigest.getInstance($ALGO, ...)
          - pattern: java.security.MessageDigest.getInstance($ALGO)
          - pattern: java.security.MessageDigest.getInstance($ALGO, ...)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?sha-?1[\"']?$"

  - id: cryptoscope.java.hash.sha2
    languages: [java]
    message: SHA-2 family usage detected (SHA-224/256/384/512).
    severity: INFO
    metadata:
      category: hash
      recommendation: Ensure a secure construction (e.g., HMAC, HKDF) where appropriate.
    patterns:
      - pattern-either:
          - pattern: MessageDigest.getInstance($ALGO)
          - pattern: java.security.MessageDigest.getInstance($ALGO)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?SHA-?(?:224|256|384|512)[\"']?$"

  - id: cryptoscope.java.mac.sha1
    languages: [java]
    message: HMAC with SHA-1 detected.
    severity: ERROR
    metadata:
      category: mac
      recommendation: Use HmacSHA256 or stronger.
    patterns:
      - pattern-either:
          - pattern: Mac.getInstance($ALGO)
          - pattern: Mac.getInstance($ALGO, ...)
          - pattern: javax.crypto.Mac.getInstance($ALGO)
          - pattern: javax.crypto.Mac.getInstance($ALGO, ...)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?hmacsha-?1[\"']?$"

  - id: cryptoscope.java.signature.md5
    languages: [java]
    message: Signature with MD5 digest detected (vulnerable to collisions).
    severity: ERROR
    metadata:
      category: signature
      recommendation: Use SHA-256/384+ or EdDSA for digital signatures.
    patterns:
      - pattern-either:
          - pattern: Signature.getInstance($ALGO)
          - pattern: java.security.Signature.getInstance($ALGO)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?MD5with(?:RSA|DSA|ECDSA)[\"']?$"

  - id: cryptoscope.java.signature.sha1
    languages: [java]
    message: Signature with SHA-1 digest detected (collision-prone).
    severity: WARNING
    metadata:
      category: signature
      recommendation: Prefer SHA-256/384+, SHA-3, or modern signature schemes like Ed25519.
    patterns:
      - pattern-either:
          - pattern: Signature.getInstance($ALGO)
          - pattern: java.security.Signature.getInstance($ALGO)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?SHA-?1with(?:RSA|DSA|ECDSA|RSAandMGF1)[\"']?$"

  - id: cryptoscope.java.signature.none
    languages: [java]
    message: Signature without hashing detected (NONEwith*).
    severity: ERROR
    metadata:
      category: signature
      recommendation: Hash the message before signing (e.g., SHA-256 with RSA/ECDSA).
    patterns:
      - pattern-either:
          - pattern: Signature.getInstance($ALGO)
          - pattern: java.security.Signature.getInstance($ALGO)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?NONEwith(?:RSA|ECDSA|DSA)[\"']?$"

  - id: cryptoscope.java.signature.modern
    languages: [java]
    message: Modern signature algorithm detected (Ed25519/Ed448).
    severity: INFO
    metadata:
      category: signature
    patterns:
      - pattern-either:
          - pattern: Signature.getInstance($ALGO)
          - pattern: java.security.Signature.getInstance($ALGO)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?Ed(?:25519|448)[\"']?$"

  - id: cryptoscope.java.aes.ecb
    languages: [java]
    message: AES/ECB mode detected (insecure).
    severity: ERROR
    metadata:
      category: mode
      recommendation: "Use GCM: Cipher.getInstance(\"AES/GCM/NoPadding\")."
    patterns:
      - pattern-either:
          - pattern: Cipher.getInstance($ALGO)
          - pattern: javax.crypto.Cipher.getInstance($ALGO)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?AES/ECB/[^\"']+[\"']?$"

  - id: cryptoscope.java.aes.cbc
    languages: [java]
    message: AES/CBC detected; ensure authentication (e.g., HMAC) and random IV.
    severity: WARNING
    metadata:
      category: mode
      recommendation: Prefer GCM (AEAD) when possible.
    patterns:
      - pattern-either:
          - pattern: Cipher.getInstance($ALGO)
          - pattern: javax.crypto.Cipher.getInstance($ALGO)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?AES/CBC/[^\"']+[\"']?$"

  - id: cryptoscope.java.cipher.gcm
    languages: [java]
    message: AES/GCM usage detected (AEAD).
    severity: INFO
    metadata:
      category: mode
    patterns:
      - pattern-either:
          - pattern: Cipher.getInstance($ALGO)
          - pattern: Cipher.getInstance($ALGO, ...)
          - pattern: javax.crypto.Cipher.getInstance($ALGO)
          - pattern: javax.crypto.Cipher.getInstance($ALGO, ...)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?AES/GCM/[^\"']+[\"']?$"

  - id: cryptoscope.java.cipher.any
    languages: [java]
    message: Cipher.getInstance usage detected.
    severity: INFO
    metadata:
      category: cipher
    pattern-either:
      - pattern: Cipher.getInstance(...)
      - pattern: javax.crypto.Cipher.getInstance(...)

  - id: cryptoscope.java.rsa.pkcs1padding
    languages: [java]
    message: RSA with PKCS#1 v1.5 padding detected (vulnerable to padding oracles).
    severity: WARNING
    metadata:
      category: cipher
      recommendation: Use OAEP (e.g., "RSA/ECB/OAEPWithSHA-256AndMGF1Padding").
    patterns:
      - pattern-either:
          - pattern: Cipher.getInstance($TRANSFORM)
          - pattern: javax.crypto.Cipher.getInstance($TRANSFORM)
      - metavariable-regex:
          metavariable: TRANSFORM
          regex: "(?i)^[\"']?RSA/ECB/PKCS1Padding[\"']?$"

  - id: cryptoscope.java.rsa.oaep.sha1
    languages: [java]
    message: RSA OAEP with SHA-1 detected (consider SHA-256+).
    severity: WARNING
    metadata:
      category: cipher
      recommendation: Prefer OAEP with SHA-256+, e.g., "RSA/ECB/OAEPWithSHA-256AndMGF1Padding".
    patterns:
      - pattern-either:
          - pattern: Cipher.getInstance($TRANSFORM)
          - pattern: javax.crypto.Cipher.getInstance($TRANSFORM)
      - metavariable-regex:
          metavariable: TRANSFORM
          regex: "(?i)^[\"']?RSA/ECB/OAEPWithSHA-?1AndMGF1Padding[\"']?$"

  - id: cryptoscope.java.aes.unspecified
    languages: [java]
    message: AES without mode/padding specified (provider default; often ECB).
    severity: WARNING
    metadata:
      category: mode
      recommendation: Specify an AEAD mode explicitly, e.g., "AES/GCM/NoPadding".
    pattern-either:
      - pattern: Cipher.getInstance("AES")
      - pattern: javax.crypto.Cipher.getInstance("AES")

  - id: cryptoscope.java.mac.generic
    languages: [java]
    message: Mac primitive usage detected.
    severity: INFO
    metadata:
      category: mac
    pattern-either:
      - pattern: Mac.getInstance(...)
      - pattern: javax.crypto.Mac.getInstance(...)

  - id: cryptoscope.java.kdf.pbkdf2.sha256
    languages: [java]
    message: PBKDF2 with HmacSHA256 usage detected.
    severity: INFO
    metadata:
      category: kdf
    pattern-either:
      - pattern: SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256")
      - pattern: javax.crypto.SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256")

  - id: cryptoscope.java.keygen.aes
    languages: [java]
    message: Symmetric key generation (AES) detected.
    severity: INFO
    metadata:
      category: keygen
    pattern-either:
      - pattern: KeyGenerator.getInstance("AES")
      - pattern: javax.crypto.KeyGenerator.getInstance("AES")

  - id: cryptoscope.java.keypair.rsa
    languages: [java]
    message: RSA keypair generation detected.
    severity: INFO
    metadata:
      category: keygen
    pattern-either:
      - pattern: KeyPairGenerator.getInstance("RSA")
      - pattern: java.security.KeyPairGenerator.getInstance("RSA")

  - id: cryptoscope.java.keypair.rsa.small
    languages: [java]
    message: RSA key size set below 2048 bits.
    severity: ERROR
    metadata:
      category: keygen
      recommendation: Use at least 2048-bit RSA keys (3072+ preferred) or switch to ECC.
    patterns:
      - pattern-either:
          - pattern: KeyPairGenerator.getInstance("RSA").initialize($BITS)
          - pattern: KeyPairGenerator.getInstance("RSA").initialize($BITS, ...)
          - pattern: java.security.KeyPairGenerator.getInstance("RSA").initialize($BITS)
          - pattern: java.security.KeyPairGenerator.getInstance("RSA").initialize($BITS, ...)
          - patterns:
              - pattern: $GEN.initialize($BITS)
              - pattern-inside: |
                  KeyPairGenerator $GEN = KeyPairGenerator.getInstance("RSA");
          - patterns:
              - pattern: $GEN.initialize($BITS, ...)
              - pattern-inside: |
                  KeyPairGenerator $GEN = KeyPairGenerator.getInstance("RSA");
          - patterns:
              - pattern: $GEN.initialize($BITS)
              - pattern-inside: |
                  java.security.KeyPairGenerator $GEN = java.security.KeyPairGenerator.getInstance("RSA");
          - patterns:
              - pattern: $GEN.initialize($BITS, ...)
              - pattern-inside: |
                  java.security.KeyPairGenerator $GEN = java.security.KeyPairGenerator.getInstance("RSA");
      - metavariable-comparison:
          metavariable: BITS
          comparison: BITS < 2048

  - id: cryptoscope.java.keypair.dsa
    languages: [java]
    message: DSA keypair generation detected (legacy algorithm).
    severity: WARNING
    metadata:
      category: keygen
      recommendation: Prefer Ed25519/Ed448 or ECDSA with modern curves.
    pattern-either:
      - pattern: KeyPairGenerator.getInstance("DSA")
      - pattern: java.security.KeyPairGenerator.getInstance("DSA")

  - id: cryptoscope.java.aes.cbc.zeroiv
    languages: [java]
    message: Zero-initialized IV via IvParameterSpec(new byte[n]).
    severity: ERROR
    metadata:
      category: mode
      recommendation: Use a random IV and prefer GCM (AEAD).
    pattern-either:
      - pattern: new IvParameterSpec(new byte[$N])
      - pattern: new javax.crypto.spec.IvParameterSpec(new byte[$N])

  - id: cryptoscope.java.random.insecure
    languages: [java]
    message: Non-cryptographic RNG detected (Random/Math.random/ThreadLocalRandom).
    severity: ERROR
    metadata:
      category: random
      recommendation: Use java.security.SecureRandom.
    pattern-either:
      - pattern: new Random(...)
      - pattern: new java.util.Random(...)
      - pattern: Math.random(...)
      - pattern: java.lang.Math.random(...)
      - pattern: ThreadLocalRandom.current().nextBoolean(...)
      - pattern: ThreadLocalRandom.current().nextBytes(...)
      - pattern: ThreadLocalRandom.current().nextDouble(...)
      - pattern: ThreadLocalRandom.current().nextFloat(...)
      - pattern: ThreadLocalRandom.current().nextGaussian(...)
      - pattern: ThreadLocalRandom.current().nextInt(...)
      - pattern: ThreadLocalRandom.current().nextLong(...)
      - pattern: java.util.concurrent.ThreadLocalRandom.current().nextBoolean(...)
      - pattern: java.util.concurrent.ThreadLocalRandom.current().nextBytes(...)
      - pattern: java.util.concurrent.ThreadLocalRandom.current().nextDouble(...)
      - pattern: java.util.concurrent.ThreadLocalRandom.current().nextFloat(...)
