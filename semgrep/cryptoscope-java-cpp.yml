rules:
  # =====================
  # Java
  # =====================
  - id: cryptoscope.java.hash.md5
    languages: [java]
    message: MD5 detected (collision-prone, not suitable for security).
    severity: ERROR
    metadata:
      category: hash
      recommendation: Use SHA-256/384/512 or SHA-3/BLAKE2/3.
    patterns:
      - pattern-either:
          - pattern: MessageDigest.getInstance($ALGO)
          - pattern: MessageDigest.getInstance($ALGO, ...)
          - pattern: java.security.MessageDigest.getInstance($ALGO)
          - pattern: java.security.MessageDigest.getInstance($ALGO, ...)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']MD5[\"']$"

  - id: cryptoscope.java.hash.sha1
    languages: [java]
    message: SHA-1 detected (collision-prone, avoid for new designs).
    severity: ERROR
    metadata:
      category: hash
      recommendation: Prefer SHA-256/384+, BLAKE2/3, or SHA-3.
    patterns:
      - pattern-either:
          - pattern: MessageDigest.getInstance($ALGO)
          - pattern: MessageDigest.getInstance($ALGO, ...)
          - pattern: java.security.MessageDigest.getInstance($ALGO)
          - pattern: java.security.MessageDigest.getInstance($ALGO, ...)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?sha-?1[\"']?$"

  - id: cryptoscope.java.hash.sha2
    languages: [java]
    message: SHA-2 family usage detected (SHA-224/256/384/512).
    severity: INFO
    metadata:
      category: hash
      recommendation: Ensure a secure construction (e.g., HMAC, HKDF) where appropriate.
    patterns:
      - pattern-either:
          - pattern: MessageDigest.getInstance($ALGO)
          - pattern: java.security.MessageDigest.getInstance($ALGO)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?SHA-?(?:224|256|384|512)[\"']?$"

  - id: cryptoscope.java.mac.sha1
    languages: [java]
    message: HMAC with SHA-1 detected.
    severity: ERROR
    metadata:
      category: mac
      recommendation: Use HmacSHA256 or stronger.
    patterns:
      - pattern-either:
          - pattern: Mac.getInstance($ALGO)
          - pattern: Mac.getInstance($ALGO, ...)
          - pattern: javax.crypto.Mac.getInstance($ALGO)
          - pattern: javax.crypto.Mac.getInstance($ALGO, ...)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?hmacsha-?1[\"']?$"

  - id: cryptoscope.java.signature.md5
    languages: [java]
    message: Signature with MD5 digest detected (vulnerable to collisions).
    severity: ERROR
    metadata:
      category: signature
      recommendation: Use SHA-256/384+ or EdDSA for digital signatures.
    patterns:
      - pattern-either:
          - pattern: Signature.getInstance($ALGO)
          - pattern: java.security.Signature.getInstance($ALGO)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?MD5with(?:RSA|DSA|ECDSA)[\"']?$"

  - id: cryptoscope.java.signature.sha1
    languages: [java]
    message: Signature with SHA-1 digest detected (collision-prone).
    severity: WARNING
    metadata:
      category: signature
      recommendation: Prefer SHA-256/384+, SHA-3, or modern signature schemes like Ed25519.
    patterns:
      - pattern-either:
          - pattern: Signature.getInstance($ALGO)
          - pattern: java.security.Signature.getInstance($ALGO)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?SHA-?1with(?:RSA|DSA|ECDSA|RSAandMGF1)[\"']?$"

  - id: cryptoscope.java.signature.none
    languages: [java]
    message: Signature without hashing detected (NONEwith*).
    severity: ERROR
    metadata:
      category: signature
      recommendation: Hash the message before signing (e.g., SHA-256 with RSA/ECDSA).
    patterns:
      - pattern-either:
          - pattern: Signature.getInstance($ALGO)
          - pattern: java.security.Signature.getInstance($ALGO)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?NONEwith(?:RSA|ECDSA|DSA)[\"']?$"

  - id: cryptoscope.java.signature.modern
    languages: [java]
    message: Modern signature algorithm detected (Ed25519/Ed448).
    severity: INFO
    metadata:
      category: signature
    patterns:
      - pattern-either:
          - pattern: Signature.getInstance($ALGO)
          - pattern: java.security.Signature.getInstance($ALGO)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?Ed(?:25519|448)[\"']?$"

  - id: cryptoscope.java.aes.ecb
    languages: [java]
    message: AES/ECB mode detected (insecure).
    severity: ERROR
    metadata:
      category: mode
      recommendation: "Use GCM: Cipher.getInstance(\"AES/GCM/NoPadding\")."
    patterns:
      - pattern-either:
          - pattern: Cipher.getInstance($ALGO)
          - pattern: javax.crypto.Cipher.getInstance($ALGO)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?AES/ECB/[^\"']+[\"']?$"

  - id: cryptoscope.java.aes.cbc
    languages: [java]
    message: AES/CBC detected; ensure authentication (e.g., HMAC) and random IV.
    severity: WARNING
    metadata:
      category: mode
      recommendation: Prefer GCM (AEAD) when possible.
    patterns:
      - pattern-either:
          - pattern: Cipher.getInstance($ALGO)
          - pattern: javax.crypto.Cipher.getInstance($ALGO)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?AES/CBC/[^\"']+[\"']?$"

  - id: cryptoscope.java.cipher.gcm
    languages: [java]
    message: AES/GCM usage detected (AEAD).
    severity: INFO
    metadata:
      category: mode
    patterns:
      - pattern-either:
          - pattern: Cipher.getInstance($ALGO)
          - pattern: Cipher.getInstance($ALGO, ...)
          - pattern: javax.crypto.Cipher.getInstance($ALGO)
          - pattern: javax.crypto.Cipher.getInstance($ALGO, ...)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?AES/GCM/[^\"']+[\"']?$"

  - id: cryptoscope.java.cipher.any
    languages: [java]
    message: Cipher.getInstance usage detected.
    severity: INFO
    metadata:
      category: cipher
    pattern-either:
      - pattern: Cipher.getInstance(...)
      - pattern: javax.crypto.Cipher.getInstance(...)

  - id: cryptoscope.java.rsa.pkcs1padding
    languages: [java]
    message: RSA with PKCS#1 v1.5 padding detected (vulnerable to padding oracles).
    severity: WARNING
    metadata:
      category: cipher
      recommendation: Use OAEP (e.g., "RSA/ECB/OAEPWithSHA-256AndMGF1Padding").
    patterns:
      - pattern-either:
          - pattern: Cipher.getInstance($TRANSFORM)
          - pattern: javax.crypto.Cipher.getInstance($TRANSFORM)
      - metavariable-regex:
          metavariable: TRANSFORM
          regex: "(?i)^[\"']?RSA/ECB/PKCS1Padding[\"']?$"

  - id: cryptoscope.java.rsa.oaep.sha1
    languages: [java]
    message: RSA OAEP with SHA-1 detected (consider SHA-256+).
    severity: WARNING
    metadata:
      category: cipher
      recommendation: Prefer OAEP with SHA-256+, e.g., "RSA/ECB/OAEPWithSHA-256AndMGF1Padding".
    patterns:
      - pattern-either:
          - pattern: Cipher.getInstance($TRANSFORM)
          - pattern: javax.crypto.Cipher.getInstance($TRANSFORM)
      - metavariable-regex:
          metavariable: TRANSFORM
          regex: "(?i)^[\"']?RSA/ECB/OAEPWithSHA-?1AndMGF1Padding[\"']?$"

  - id: cryptoscope.java.aes.unspecified
    languages: [java]
    message: AES without mode/padding specified (provider default; often ECB).
    severity: WARNING
    metadata:
      category: mode
      recommendation: Specify an AEAD mode explicitly, e.g., "AES/GCM/NoPadding".
    pattern-either:
      - pattern: Cipher.getInstance("AES")
      - pattern: javax.crypto.Cipher.getInstance("AES")

  - id: cryptoscope.java.mac.generic
    languages: [java]
    message: Mac primitive usage detected.
    severity: INFO
    metadata:
      category: mac
    pattern-either:
      - pattern: Mac.getInstance(...)
      - pattern: javax.crypto.Mac.getInstance(...)

  - id: cryptoscope.java.kdf.pbkdf2.sha256
    languages: [java]
    message: PBKDF2 with HmacSHA256 usage detected.
    severity: INFO
    metadata:
      category: kdf
    pattern-either:
      - pattern: SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256")
      - pattern: javax.crypto.SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256")

  - id: cryptoscope.java.keygen.aes
    languages: [java]
    message: Symmetric key generation (AES) detected.
    severity: INFO
    metadata:
      category: keygen
    pattern-either:
      - pattern: KeyGenerator.getInstance("AES")
      - pattern: javax.crypto.KeyGenerator.getInstance("AES")

  - id: cryptoscope.java.keypair.rsa
    languages: [java]
    message: RSA keypair generation detected.
    severity: INFO
    metadata:
      category: keygen
    pattern-either:
      - pattern: KeyPairGenerator.getInstance("RSA")
      - pattern: java.security.KeyPairGenerator.getInstance("RSA")

  - id: cryptoscope.java.keypair.rsa.small
    languages: [java]
    message: RSA key size set below 2048 bits.
    severity: ERROR
    metadata:
      category: keygen
      recommendation: Use at least 2048-bit RSA keys (3072+ preferred) or switch to ECC.
    patterns:
      - pattern-either:
          - pattern: KeyPairGenerator.getInstance("RSA").initialize($BITS)
          - pattern: KeyPairGenerator.getInstance("RSA").initialize($BITS, ...)
          - pattern: java.security.KeyPairGenerator.getInstance("RSA").initialize($BITS)
          - pattern: java.security.KeyPairGenerator.getInstance("RSA").initialize($BITS, ...)
          - patterns:
              - pattern: $GEN.initialize($BITS)
              - pattern-inside: |
                  KeyPairGenerator $GEN = KeyPairGenerator.getInstance("RSA");
          - patterns:
              - pattern: $GEN.initialize($BITS, ...)
              - pattern-inside: |
                  KeyPairGenerator $GEN = KeyPairGenerator.getInstance("RSA");
          - patterns:
              - pattern: $GEN.initialize($BITS)
              - pattern-inside: |
                  java.security.KeyPairGenerator $GEN = java.security.KeyPairGenerator.getInstance("RSA");
          - patterns:
              - pattern: $GEN.initialize($BITS, ...)
              - pattern-inside: |
                  java.security.KeyPairGenerator $GEN = java.security.KeyPairGenerator.getInstance("RSA");
      - metavariable-comparison:
          metavariable: BITS
          comparison: BITS < 2048

  - id: cryptoscope.java.keypair.dsa
    languages: [java]
    message: DSA keypair generation detected (legacy algorithm).
    severity: WARNING
    metadata:
      category: keygen
      recommendation: Prefer Ed25519/Ed448 or ECDSA with modern curves.
    pattern-either:
      - pattern: KeyPairGenerator.getInstance("DSA")
      - pattern: java.security.KeyPairGenerator.getInstance("DSA")

  - id: cryptoscope.java.aes.cbc.zeroiv
    languages: [java]
    message: Zero-initialized IV via IvParameterSpec(new byte[n]).
    severity: ERROR
    metadata:
      category: mode
      recommendation: Use a random IV and prefer GCM (AEAD).
    pattern-either:
      - pattern: new IvParameterSpec(new byte[$N])
      - pattern: new javax.crypto.spec.IvParameterSpec(new byte[$N])

  - id: cryptoscope.java.random.insecure
    languages: [java]
    message: Non-cryptographic RNG detected (Random/Math.random/ThreadLocalRandom).
    severity: ERROR
    metadata:
      category: random
      recommendation: Use java.security.SecureRandom.
    pattern-either:
      - pattern: new Random(...)
      - pattern: new java.util.Random(...)
      - pattern: Math.random(...)
      - pattern: java.lang.Math.random(...)
      - pattern: ThreadLocalRandom.current().nextBoolean(...)
      - pattern: ThreadLocalRandom.current().nextBytes(...)
      - pattern: ThreadLocalRandom.current().nextDouble(...)
      - pattern: ThreadLocalRandom.current().nextFloat(...)
      - pattern: ThreadLocalRandom.current().nextGaussian(...)
      - pattern: ThreadLocalRandom.current().nextInt(...)
      - pattern: ThreadLocalRandom.current().nextLong(...)
      - pattern: java.util.concurrent.ThreadLocalRandom.current().nextBoolean(...)
      - pattern: java.util.concurrent.ThreadLocalRandom.current().nextBytes(...)
      - pattern: java.util.concurrent.ThreadLocalRandom.current().nextDouble(...)
      - pattern: java.util.concurrent.ThreadLocalRandom.current().nextFloat(...)
      - pattern: java.util.concurrent.ThreadLocalRandom.current().nextGaussian(...)
      - pattern: java.util.concurrent.ThreadLocalRandom.current().nextInt(...)
      - pattern: java.util.concurrent.ThreadLocalRandom.current().nextLong(...)
      - pattern: new SplittableRandom(...)
      - pattern: new java.util.SplittableRandom(...)

  - id: cryptoscope.java.random.sha1prng
    languages: [java]
    message: SecureRandom with SHA1PRNG detected (legacy provider).
    severity: WARNING
    metadata:
      category: random
      recommendation: Prefer default SecureRandom provider or SecureRandom.getInstanceStrong().
    patterns:
      - pattern-either:
          - pattern: SecureRandom.getInstance($ALGO)
          - pattern: SecureRandom.getInstance($ALGO, ...)
          - pattern: java.security.SecureRandom.getInstance($ALGO)
          - pattern: java.security.SecureRandom.getInstance($ALGO, ...)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?SHA1PRNG[\"']?$"

  - id: cryptoscope.java.random.seed.constant
    languages: [java]
    message: SecureRandom seeded with constant or zeroed byte array.
    severity: ERROR
    metadata:
      category: random
      recommendation: Let SecureRandom self-seed or use os-provided entropy sources.
    patterns:
      - pattern-either:
          - pattern: new SecureRandom($SEED)
          - pattern: new java.security.SecureRandom($SEED)
          - patterns:
              - pattern: $SR.setSeed($SEED)
              - pattern-inside: |
                  SecureRandom $SR = ...;
          - patterns:
              - pattern: $SR.setSeed($SEED)
              - pattern-inside: |
                  java.security.SecureRandom $SR = ...;
      - metavariable-pattern:
          metavariable: SEED
          pattern-either:
            - pattern: new byte[$N]
            - pattern: new byte[] { ... }

  - id: cryptoscope.java.securerandom
    languages: [java]
    message: SecureRandom usage detected (CSPRNG).
    severity: INFO
    metadata:
      category: random
    pattern-either:
      - pattern: new SecureRandom(...)
      - pattern: SecureRandom.getInstance(...)
      - pattern: new java.security.SecureRandom(...)
      - pattern: java.security.SecureRandom.getInstance(...)

  # Additional Java coverage
  - id: cryptoscope.java.crypto.any
    languages: [java]
    message: Crypto API usage detected (generic match).
    severity: INFO
    metadata:
      category: primitive
    pattern-either:
      - pattern: MessageDigest.getInstance(...)
      - pattern: java.security.MessageDigest.getInstance(...)
      - pattern: Mac.getInstance(...)
      - pattern: javax.crypto.Mac.getInstance(...)
      - pattern: Cipher.getInstance(...)
      - pattern: javax.crypto.Cipher.getInstance(...)
      - pattern: Signature.getInstance(...)
      - pattern: java.security.Signature.getInstance(...)
      - pattern: KeyGenerator.getInstance(...)
      - pattern: javax.crypto.KeyGenerator.getInstance(...)
      - pattern: KeyPairGenerator.getInstance(...)
      - pattern: java.security.KeyPairGenerator.getInstance(...)
      - pattern: SecretKeyFactory.getInstance(...)
      - pattern: javax.crypto.SecretKeyFactory.getInstance(...)
      - pattern: KeyFactory.getInstance(...)
      - pattern: java.security.KeyFactory.getInstance(...)
      - pattern: KeyAgreement.getInstance(...)
      - pattern: javax.crypto.KeyAgreement.getInstance(...)

  - id: cryptoscope.java.cipher.des
    languages: [java]
    message: DES/3DES detected (insecure cipher).
    severity: ERROR
    metadata:
      category: cipher
      recommendation: Use AES-GCM/ChaCha20-Poly1305 instead of DES/3DES.
    patterns:
      - pattern-either:
          - pattern: Cipher.getInstance($ALGO)
          - pattern: javax.crypto.Cipher.getInstance($ALGO)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?(?:DES(?:/[^\"']+){0,2}|DESede(?:/[^\"']+){0,2})[\"']?$"

  - id: cryptoscope.java.cipher.rc4
    languages: [java]
    message: RC4/ARCFOUR detected (insecure stream cipher).
    severity: ERROR
    metadata:
      category: cipher
      recommendation: Replace RC4 with ChaCha20 or AES-GCM.
    patterns:
      - pattern-either:
          - pattern: Cipher.getInstance($ALGO)
          - pattern: javax.crypto.Cipher.getInstance($ALGO)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?(?:RC4|ARCFOUR)(?:/[^\"']+){0,2}[\"']?$"

  - id: cryptoscope.java.cipher.rc2
    languages: [java]
    message: RC2 detected (legacy block cipher).
    severity: ERROR
    metadata:
      category: cipher
      recommendation: Use AES-GCM/ChaCha20-Poly1305 instead.
    patterns:
      - pattern-either:
          - pattern: Cipher.getInstance($ALGO)
          - pattern: javax.crypto.Cipher.getInstance($ALGO)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?RC2(?:/[^\"']+){0,2}[\"']?$"

  - id: cryptoscope.java.aes.ctr
    languages: [java]
    message: AES/CTR detected; ensure unique nonce and add authentication (e.g., HMAC).
    severity: WARNING
    metadata:
      category: mode
    patterns:
      - pattern-either:
          - pattern: Cipher.getInstance($ALGO)
          - pattern: javax.crypto.Cipher.getInstance($ALGO)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?AES/CTR/[^\"']+[\"']?$"

  - id: cryptoscope.java.aes.cfb_ofb
    languages: [java]
    message: AES/CFB or AES/OFB detected; consider AEAD instead.
    severity: WARNING
    metadata:
      category: mode
    patterns:
      - pattern-either:
          - pattern: Cipher.getInstance($ALGO)
          - pattern: javax.crypto.Cipher.getInstance($ALGO)
      - metavariable-regex:
          metavariable: ALGO
          regex: "(?i)^[\"']?AES/(?:CFB|OFB)/[^\"']+[\"']?$"

  - id: cryptoscope.java.kdf.pbkdf2.sha1
    languages: [java]
    message: PBKDF2WithHmacSHA1 detected.
    severity: WARNING
    metadata:
      category: kdf
      recommendation: Prefer PBKDF2WithHmacSHA256/512 or Argon2/scrypt.
    pattern-either:
      - pattern: SecretKeyFactory.getInstance("PBKDF2WithHmacSHA1")
      - pattern: javax.crypto.SecretKeyFactory.getInstance("PBKDF2WithHmacSHA1")

  - id: cryptoscope.java.mac.hmacmd5
    languages: [java]
    message: HmacMD5 detected (weak MAC).
    severity: ERROR
    metadata:
      category: mac
      recommendation: Use HmacSHA256/384/512.
    pattern-either:
      - pattern: Mac.getInstance("HmacMD5")
      - pattern: javax.crypto.Mac.getInstance("HmacMD5")

  - id: cryptoscope.java.gcm.tag.short
    languages: [java]
    message: GCM tag length appears short (< 96 bits).
    severity: WARNING
    metadata:
      category: mode
      recommendation: Use 96–128-bit tags; 128-bit is typical for AES-GCM.
    patterns:
      - pattern: new GCMParameterSpec($T, $IV)
      - metavariable-comparison:
          metavariable: T
          comparison: T < 96

  - id: cryptoscope.java.random.setseed.numeric
    languages: [java]
    message: SecureRandom seeded with numeric literal.
    severity: ERROR
    metadata:
      category: random
    recommendation: Avoid manual static seeding; let SecureRandom self-seed.
    patterns:
      - patterns:
          - pattern: $SR.setSeed($N)
          - pattern-inside: |
              SecureRandom $SR = ...;
      - metavariable-regex:
          metavariable: N
          regex: "^(?:-?\d+L?)$"

  # =====================
  # C / C++ (OpenSSL, libc)
  # =====================
  - id: cryptoscope.c.hash.weak
    languages: [c, cpp]
    message: Weak hash primitive detected (MD2/MD4/MD5/SHA1 family).
    severity: ERROR
    metadata:
      category: hash
      recommendation: Use SHA-256/512, SHA-3, or BLAKE2/3 instead.
    patterns:
      - pattern-either:
          - pattern: $FUNC(...)
          - pattern: $FUNC()
      - metavariable-regex:
          metavariable: FUNC
          regex: "\\b(EVP_md[245]|MD[245](?:_(?:Init|Update|Final))?|MD[245]|CC_MD5|SHA1(?:_(?:Init|Update|Final))?|SHA1|EVP_sha1)\\b"

  - id: cryptoscope.c.hash.strong
    languages: [c, cpp]
    message: Modern hash primitive detected (SHA-2/SHA-3/BLAKE2).
    severity: INFO
    metadata:
      category: hash
    pattern-either:
      - pattern: EVP_sha256(...)
      - pattern: EVP_sha256()
      - pattern: EVP_sha384(...)
      - pattern: EVP_sha384()
      - pattern: EVP_sha512(...)
      - pattern: EVP_sha512()
      - pattern: EVP_sha3_256(...)
      - pattern: EVP_sha3_256()
      - pattern: EVP_sha3_512(...)
      - pattern: EVP_sha3_512()
      - pattern: EVP_blake2b512(...)
      - pattern: EVP_blake2b512()
      - pattern: EVP_blake2s256(...)
      - pattern: EVP_blake2s256()

  - id: cryptoscope.c.cipher.aes.ecb
    languages: [c, cpp]
    message: AES ECB usage detected.
    severity: ERROR
    metadata:
      category: mode
      recommendation: Prefer AEAD modes such as AES-GCM or ChaCha20-Poly1305.
    patterns:
      - pattern-either:
          - pattern: $FUNC(...)
          - pattern: $FUNC()
      - metavariable-regex:
          metavariable: FUNC
          regex: "\\bEVP_aes_[0-9]+_ecb\\b"

  - id: cryptoscope.c.cipher.aes.cbc
    languages: [c, cpp]
    message: AES CBC usage detected.
    severity: WARNING
    metadata:
      category: mode
      recommendation: Use AEAD modes like AES-GCM whenever possible.
    patterns:
      - pattern-either:
          - pattern: $FUNC(...)
          - pattern: $FUNC()
      - metavariable-regex:
          metavariable: FUNC
          regex: "\\bEVP_aes_[0-9]+_cbc\\b"

  - id: cryptoscope.c.cipher.aes.ctr_cfb_ofb
    languages: [c, cpp]
    message: AES in CTR/CFB/OFB detected; ensure nonce/IV safety and add authentication.
    severity: WARNING
    metadata:
      category: mode
    patterns:
      - pattern-either:
          - pattern: $FUNC(...)
          - pattern: $FUNC()
      - metavariable-regex:
          metavariable: FUNC
          regex: "\\bEVP_aes_[0-9]+_(?:ctr|cfb(?:1|8)?|ofb)\\b"

  - id: cryptoscope.c.cipher.des
    languages: [c, cpp]
    message: DES/3DES usage detected (deprecated cipher).
    severity: ERROR
    metadata:
      category: cipher
    recommendation: Migrate to AES-GCM or ChaCha20-Poly1305.
    patterns:
      - pattern-either:
          - pattern: $FUNC(...)
          - pattern: $FUNC()
      - metavariable-regex:
          metavariable: FUNC
          regex: "\\b(EVP_des(?:_ede3)?_(?:ecb|cbc)|DES_(?:ecb|cbc)_encrypt|DES_set_key(?:_unchecked)?)\\b"

  - id: cryptoscope.c.cipher.rc2
    languages: [c, cpp]
    message: RC2 usage detected (legacy cipher).
    severity: ERROR
    metadata:
      category: cipher
      recommendation: Use AES-GCM/ChaCha20-Poly1305 instead.
    patterns:
      - pattern-either:
          - pattern: $FUNC(...)
          - pattern: $FUNC()
      - metavariable-regex:
          metavariable: FUNC
          regex: "\\b(EVP_rc2(?:_cbc|_ecb)?|RC2_(?:cbc|ecb)_encrypt)\\b"

  - id: cryptoscope.c.cipher.rc4
    languages: [c, cpp]
    message: RC4 stream cipher detected (insecure).
    severity: ERROR
    metadata:
      category: cipher
      recommendation: Replace RC4 with ChaCha20 or AES-GCM.
